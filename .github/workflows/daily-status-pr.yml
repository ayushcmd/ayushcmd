name: Daily Live Status Draft PR

# Opens a new Draft PR every day at 7:00 AM IST (01:30 UTC) so Ayush only has
# to edit the two fields (`status` and `until`) in data/status.json.
# Never auto-merges, never duplicates a PR for the same IST date, and never
# overwrites manually entered values.

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional IST date override (YYYY-MM-DD). Leave blank for today in IST."
        required: false
        type: string
      dry_run:
        description: "Preview planned branch and PR without creating or modifying anything."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-status-pr
  cancel-in-progress: false

jobs:
  prepare-daily-status-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.STATUS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare and open daily status Draft PR
        env:
          GITHUB_TOKEN: ${{ secrets.STATUS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          args=("--base-branch" "${DEFAULT_BRANCH:-main}")
          if [ -n "${INPUT_DATE}" ]; then
            args+=("--date" "${INPUT_DATE}")
          fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            args+=("--dry-run")
          fi
          python scripts/prepare_daily_status_pr.py "${args[@]}"
