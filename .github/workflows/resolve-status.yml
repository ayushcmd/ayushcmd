name: Resolve Live Status

# Resolves data/status.json + data/status_meta.json + data/status_presets.json
# into data/status_resolved.json and renders img/status/available.svg for
# README.md. Runs immediately after a daily status PR merges to main, and every
# 30 minutes so automatic night sleeping (22:00-05:59:59 IST), 06:00 restoration,
# and expiry to offline update without manual intervention. No commit is made
# when resolved status and SVG are unchanged.

on:
  push:
    branches:
      - main
    paths:
      - "data/status.json"
      - "data/status_meta.json"
      - "data/status_presets.json"
      - "scripts/status_engine.py"
      - "scripts/resolve_status.py"
      - "scripts/render_status_svg.py"
      - ".github/workflows/resolve-status.yml"
  schedule:
    # Runs at :00 and :30 every hour (matches :00 and :30 in IST too).
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rewrite of data/status_resolved.json and img/status/available.svg even if unchanged."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: resolve-live-status
  cancel-in-progress: false

jobs:
  resolve-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve live status
        env:
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "${INPUT_FORCE}" = "true" ]; then
            args+=("--force")
          fi
          python scripts/resolve_status.py "${args[@]}"

      - name: Render live status SVG
        env:
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "${INPUT_FORCE}" = "true" ]; then
            args+=("--force")
          fi
          python scripts/render_status_svg.py "${args[@]}"

      - name: Commit resolved live status and SVG if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update resolved live status and SVG [skip ci]"
          file_pattern: "data/status_resolved.json img/status/available.svg"
