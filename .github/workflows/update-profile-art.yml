name: Update Contribution Graph & Stats

# Refreshes contribution heatmap, statistics dashboard, languages donut, codebase
# analytics and star statistics (personal account and organizations) daily from
# real GitHub data.
# Runs daily on schedule, on push to main, and on demand via workflow_dispatch.

on:
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC daily
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  refresh-profile-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Fetch real contribution data
        env:
          GH_PROFILE_USER: ayushcmd
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_contributions.py

      - name: Render contribution heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Render statistics dashboard SVG
        run: |
          python scripts/make_info_card.py

      # The steps below are additive. continue-on-error keeps the heatmap and
      # stats refresh working even if one of them fails.
      - name: Render languages donut SVG
        continue-on-error: true
        env:
          GH_USERNAME: ayushcmd
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/make_languages_donut.py

      - name: Render codebase analytics SVG
        continue-on-error: true
        env:
          GH_USERNAME: ayushcmd
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with read access to private repos (repo scope, or fine-grained
          # "Contents: read" + "Metadata: read"). Without it, only public repos are counted.
          LOC_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          INCLUDE_PRIVATE: "true"
          INCLUDE_FORKS: "false"
          SHOW_PRIVATE_NAMES: "false"
        run: |
          python scripts/make_loc_stats.py

      - name: Render star statistics SVG
        continue-on-error: true
        env:
          GH_USERNAME: ayushcmd
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCLUDE_FORKS: "true"
        run: |
          python scripts/make_star_stats.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph and stats [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg contrib-heatmap.svg assets/info-card.svg assets/languages-donut.svg assets/codebase-analytics.svg data/loc-stats.json assets/star-stats*.svg data/star-stats*.json"
