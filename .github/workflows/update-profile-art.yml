name: Update Contribution Graph & Stats

# Refreshes contribution heatmap, statistics dashboard, languages donut, codebase
# analytics and star statistics (personal account and organizations) eleven times
# daily from real GitHub data.
# Runs on schedule, on push to main, and on demand via workflow_dispatch.

on:
  schedule:
    # GitHub cron runs in UTC. IST (UTC+05:30) run times:
    # 06:00, 08:00, 10:00, 11:00, 13:00, 15:00, 17:00, 19:00, 21:00, 22:00, 00:00
    - cron: "30 0,2,4,5,7,9,11,13,15,16,18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

# Only one refresh runs at a time so two commits never race to push.
concurrency:
  group: refresh-profile-art
  cancel-in-progress: false

jobs:
  refresh-profile-art:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Scripts label snapshots with date.today(); use IST so the label matches
      # the local calendar day, including the midnight run.
      TZ: Asia/Kolkata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Fetch real contribution data
        env:
          GH_PROFILE_USER: ayushcmd
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_contributions.py

      - name: Render contribution heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Render statistics dashboard SVG
        run: |
          python scripts/make_info_card.py

      # The steps below are additive. continue-on-error keeps the heatmap and
      # stats refresh working even if one of them fails.
      - name: Render languages donut SVG
        continue-on-error: true
        env:
          GH_USERNAME: ayushcmd
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/make_languages_donut.py

      - name: Render codebase analytics SVG
        continue-on-error: true
        env:
          GH_USERNAME: ayushcmd
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with read access to private repos (repo scope, or fine-grained
          # "Contents: read" + "Metadata: read"). Without it, only public repos are counted.
          LOC_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          INCLUDE_PRIVATE: "true"
          INCLUDE_FORKS: "false"
          SHOW_PRIVATE_NAMES: "false"
        run: |
          python scripts/make_loc_stats.py

      - name: Render star statistics SVG
        continue-on-error: true
        env:
          GH_USERNAME: ayushcmd
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCLUDE_FORKS: "true"
        run: |
          python scripts/make_star_stats.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph and stats [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg contrib-heatmap.svg assets/info-card.svg assets/languages-donut.svg assets/codebase-analytics.svg assets/codebase-overview.svg data/loc-stats.json assets/star-stats*.svg assets/stars-overview.svg data/star-stats*.json"
