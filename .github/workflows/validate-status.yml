name: Validate Live Status

# Validates data/status.json (strictly two fields, no placeholders, valid preset
# and 24-hour HH:MM), data/status_presets.json, data/status_meta.json, and runs
# the live status test suite.
#
# Note on GitHub Actions token-trigger limits:
# Draft PRs opened with the default GITHUB_TOKEN do not trigger `opened`.
# As soon as you (or Copilot) push an edit to data/status.json, or mark the PR
# Ready for review, `synchronize` / `ready_for_review` triggers this workflow.
# No path filter is applied so this check can safely be marked as required in
# branch protection / rulesets without stalling unrelated PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-live-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyYAML for workflow validation tests
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML==6.0.2

      - name: Validate live status configuration and presets
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          args=("--strict" "--check-only")
          if [ -n "${PR_HEAD_BRANCH}" ]; then
            args+=("--branch" "${PR_HEAD_BRANCH}")
          fi
          python scripts/resolve_status.py "${args[@]}"

      - name: Run live status test suite
        run: |
          python -m unittest discover -s tests -p "test_status_system.py" -v
